<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting… – Internet sin líos</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:80px auto;padding:0 20px;line-height:1.6;color:#1b2330;text-align:center}
</style>
</head>
<body>
<h1>Connecting your account…</h1>
<p id="msg">Returning to the application on your computer.</p>
<script>
  // Reenvía el resultado de la autorización (code y state) al servidor local del propietario.
  var q = window.location.search || "";
  if (q.indexOf("code=") !== -1 || q.indexOf("error=") !== -1) {
    window.location.replace("http://127.0.0.1:8765/callback/" + q);
  } else {
    document.getElementById("msg").textContent = "Nothing to do here. This page only completes the authorization of the owner's own application.";
  }
</script>
</body>
</html>
